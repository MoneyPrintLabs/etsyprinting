[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stallkit"
version = "0.2.0"
description = "Open-source Etsy seller automation CLI: bulk listings, order/tracking sync, and SEO analysis via the official Etsy Open API v3."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["etsy", "ecommerce", "automation", "cli", "seo", "print-on-demand"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    # Mockup compositing. Ships prebuilt wheels for Windows, macOS (Intel + ARM) and
    # Linux with no compiler needed - which is the whole reason the image half is
    # Python rather than a Node/Sharp sidecar.
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
heic = ["pillow-heif>=0.16"]

[project.urls]
Homepage = "https://github.com/MoneyPrintLabs/etsyprinting"
Issues = "https://github.com/MoneyPrintLabs/etsyprinting/issues"
Changelog = "https://github.com/MoneyPrintLabs/etsyprinting/blob/main/CHANGELOG.md"

[project.scripts]
stallkit = "stallkit.cli:main"

# A windowed launcher: no console window behind the app on Windows.
[project.gui-scripts]
stallkit-desktop = "stallkit.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["stallkit"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's API is built on both of these:
#   B008  - typer.Option()/Argument() must be evaluated in the default, that is the contract.
#   UP045 - Typer resolves annotations at runtime; `X | None` breaks that on Python 3.9
#           even with `from __future__ import annotations`, so Optional[X] stays.
"stallkit/cli.py" = ["B008", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Capture at the Python level, not by swapping file descriptors. On Windows the fd
# swap intermittently makes Tcl fail to read its own library files (a bare tk.Tk()
# fails ~3% of the time under --capture=fd, never under sys), which turns the desktop
# window tests into coin flips. No test here reads captured output via capfd.
addopts = "--capture=sys"
# A test stuck for two minutes prints every thread's stack, so a hang on a CI
# runner says where it is instead of only timing out.
faulthandler_timeout = 120
